[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-team"
version = "0.1.0"
description = "A policy-controlled Azure OpenAI software development team"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "openai>=1.40,<3",
    "Pillow>=10,<12",
    "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
]

[project.scripts]
ai-dev-team = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603", "B607", "B108"]
